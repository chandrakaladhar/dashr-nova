      # - name: Push image
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: |
      #     VERSION="${GITHUB_REF_NAME#v}"
      #     echo "${{ secrets.HARBOR_PASSWORD }}" | docker login harbor.example.internal -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin
      #     docker tag dashr-nova:ci harbor.example.internal/dashr/dashr-nova:$VERSION
      #     docker push harbor.example.internal/dashr/dashr-nova:$VERSION
