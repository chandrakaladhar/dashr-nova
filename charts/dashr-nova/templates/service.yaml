apiVersion: v1
kind: Service
metadata:
  name: {{ include "dashr-nova.fullname" . }}
  labels:
    {{- include "dashr-nova.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dashr-nova.selectorLabels" . | nindent 4 }}
  ports:
    - name: http          # "http" prefix tells Istio the protocol
      port: {{ .Values.service.port }}
      targetPort: http
