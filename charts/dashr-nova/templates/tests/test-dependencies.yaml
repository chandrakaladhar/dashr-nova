# `helm test <release>`: asks the running app to check every configured
# dependency (GET /api/dependencies) and fails if any is unreachable.
# Uses the app image, so it needs nothing extra and passes image policies.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "dashr-nova.fullname" . }}-test-dependencies
  labels:
    {{- include "dashr-nova.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: {{ include "dashr-nova.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - node
        - -e
        - |
          const url = "http://{{ include "dashr-nova.fullname" . }}:{{ .Values.service.port }}/api/dependencies";
          fetch(url, { signal: AbortSignal.timeout(10000) })
            .then(async (r) => { const body = await r.json(); console.log(JSON.stringify(body, null, 2)); process.exit(body.ok ? 0 : 1); })
            .catch((e) => { console.error("request to " + url + " failed: " + e.message); process.exit(1); });
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
