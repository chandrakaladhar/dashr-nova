# Recommended: credentials come from a Secret you manage (External Secrets,
# Vault/OpenBao, CNPG, sealed secrets...). See secret-example.yaml for its shape.
image:
  repository: harbor.example.internal/dashr/dashr-nova
  tag: "0.1.0"
database:
  existingSecret: dashr-nova-db
  existingSecretKey: DATABASE_URL
temporal:
  enabled: true
  address: temporal-frontend.temporal.svc.cluster.local:7233
  namespace: default
opa:
  enabled: true
  url: http://opa.policy.svc.cluster.local:8181
  policyPath: dashr/authz/allow
istio:
  virtualService:
    enabled: true
    host: dashr-nova.example.edu.au
    gateway: istio-ingress/main-gateway
